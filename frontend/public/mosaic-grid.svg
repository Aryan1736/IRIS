<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <defs>
    <pattern id="mosaic" x="0" y="0" width="400" height="400" patternUnits="userSpaceOnUse">
      <!-- Large Square -->
      <rect x="0" y="0" width="200" height="200" fill="#FAF9F6" stroke="#3A3A38" stroke-width="0.75" stroke-opacity="0.18" />
      <!-- Horizontal Strip -->
      <rect x="200" y="0" width="200" height="100" fill="#FAF9F6" stroke="#3A3A38" stroke-width="0.75" stroke-opacity="0.18" />
      <!-- Small Rects -->
      <rect x="200" y="100" width="100" height="100" fill="#FAF9F6" stroke="#3A3A38" stroke-width="0.75" stroke-opacity="0.18" />
      <rect x="300" y="100" width="100" height="100" fill="#FAF9F6" stroke="#3A3A38" stroke-width="0.75" stroke-opacity="0.18" />
      <!-- Vertical Block -->
      <rect x="0" y="200" width="100" height="200" fill="#FAF9F6" stroke="#3A3A38" stroke-width="0.75" stroke-opacity="0.18" />
      <!-- Bottom Rects -->
      <rect x="100" y="200" width="300" height="200" fill="#FAF9F6" stroke="#3A3A38" stroke-width="0.75" stroke-opacity="0.18" />
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#mosaic)" />
</svg>
