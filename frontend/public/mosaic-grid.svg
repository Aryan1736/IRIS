<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <filter id="soften" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.2" />
    </filter>
  </defs>
  <g fill="#F7F7F5" stroke="#3A3A38" stroke-width="0.5" stroke-opacity="0.2" filter="url(#soften)">
    <!-- Base background rect -->
    <rect x="0" y="0" width="1200" height="800" fill="#F7F7F5" stroke="none" />

    <!-- Section 1 (y: 0 to 320) -->
    <rect x="0" y="0" width="500" height="320" />
    <rect x="500" y="0" width="400" height="120" />
    <rect x="900" y="0" width="300" height="120" />
    <rect x="500" y="120" width="160" height="200" />
    <rect x="660" y="120" width="340" height="200" />
    <rect x="1000" y="120" width="200" height="90" />
    <rect x="1000" y="210" width="200" height="110" />

    <!-- Section 2 (y: 320 to 560) -->
    <rect x="0" y="320" width="180" height="240" />
    <rect x="180" y="320" width="540" height="240" />
    <rect x="720" y="320" width="300" height="110" />
    <rect x="720" y="430" width="140" height="130" />
    <rect x="860" y="430" width="160" height="130" />
    <rect x="1020" y="320" width="180" height="240" />

    <!-- Section 3 (y: 560 to 800) -->
    <rect x="0" y="560" width="380" height="120" />
    <rect x="0" y="680" width="180" height="120" />
    <rect x="180" y="680" width="200" height="120" />
    <rect x="380" y="560" width="460" height="240" />
    <rect x="840" y="560" width="160" height="240" />
    <rect x="1000" y="560" width="200" height="110" />
    <rect x="1000" y="670" width="200" height="130" />
  </g>
</svg>
